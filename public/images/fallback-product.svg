<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Smooth Deep Navy Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f243e"/>
      <stop offset="50%" stop-color="#091626"/>
      <stop offset="100%" stop-color="#040a12"/>
    </radialGradient>

    <!-- Subtle Container Squircle Gradient -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#163254"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle Inner Glow -->
    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Background -->
  <rect width="1200" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle Inset Border Frame (Tasteful & Polished) -->
  <rect x="24" y="24" width="1152" height="752" rx="16" fill="none" stroke="#1e385c" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Center Visual Focal: Clean Minimalist Camera Icon (Purely Visual, No Text) -->
  <g transform="translate(600, 400)">
    <!-- Ambient Halo Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.08"/>

    <!-- Soft Base Squircle / Rounded Plate -->
    <rect x="-92" y="-92" width="184" height="184" rx="44" fill="url(#squircleGrad)" stroke="#224872" stroke-width="2" filter="url(#softShadow)"/>

    <!-- Minimalist Camera Geometry -->
    <g transform="translate(0, 4)">
      <!-- Camera Body -->
      <path d="M -44 -14 L -32 -14 L -26 -26 L 26 -26 L 32 -14 L 44 -14 C 52 -14 56 -10 56 -2 L 56 34 C 56 42 52 46 44 46 L -44 46 C -52 46 -56 42 -56 34 L -56 -2 C -56 -10 -52 -14 -44 -14 Z"
            fill="none" stroke="#94a3b8" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

      <!-- Small Flash Sensor Lamp -->
      <circle cx="-34" cy="-3" r="3.5" fill="#64748b"/>

      <!-- Top Shutter Detail -->
      <line x1="20" y1="-26" x2="30" y2="-26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

      <!-- Camera Lens Outer Ring -->
      <circle cx="0" cy="15" r="23" fill="url(#lensGlow)" stroke="#94a3b8" stroke-width="4.5"/>

      <!-- Inner Aperture Ring -->
      <circle cx="0" cy="15" r="13" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="3,3"/>

      <!-- Soft Lens Glare Spark -->
      <circle cx="6" cy="9" r="2.5" fill="#ffffff" fill-opacity="0.75"/>
    </g>
  </g>
</svg>