<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBgPress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <radialGradient id="moltenGlowPress" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c82425" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#062040" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPress" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#navyBgPress)" />
  <rect width="600" height="400" fill="url(#gridPress)" opacity="0.7" />
  <circle cx="300" cy="190" r="160" fill="url(#moltenGlowPress)" />
  
  <!-- Sutherland Forging Press Outline -->
  <g transform="translate(190, 45)" stroke-width="2.5" fill="none">
    <!-- Crown Top Frame -->
    <rect x="25" y="15" width="170" height="45" rx="4" stroke="#ffffff" stroke-width="2.5" fill="#0d2b52" />
    <text x="110" y="42" fill="#f26a1b" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">SUTHERLAND 1000T</text>
    
    <!-- Left & Right Columns / Uprights -->
    <rect x="25" y="60" width="30" height="170" stroke="#f26a1b" stroke-width="2" fill="#062040" />
    <rect x="165" y="60" width="30" height="170" stroke="#f26a1b" stroke-width="2" fill="#062040" />
    
    <!-- Ram / Slide with X-Angle Guidance -->
    <rect x="65" y="90" width="90" height="55" rx="3" stroke="#c82425" stroke-width="3" fill="#1e3a64" />
    <path d="M 75 117 L 145 117 M 110 95 L 110 140" stroke="#f26a1b" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Lower Bolster Bed & Anvil -->
    <rect x="15" y="230" width="190" height="35" rx="4" stroke="#ffffff" stroke-width="2.5" fill="#0d2b52" />
    <rect x="65" y="210" width="90" height="20" stroke="#f26a1b" stroke-width="2" fill="#c82425" opacity="0.8" />
    
    <!-- Digital I-PRESS Screen Pendant -->
    <rect x="205" y="110" width="30" height="42" rx="3" stroke="#22c55e" stroke-width="2" fill="#062040" />
    <line x1="195" y1="125" x2="205" y2="125" stroke="#22c55e" stroke-width="2" />
    <rect x="210" y="115" width="20" height="15" fill="#22c55e" opacity="0.4" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SUTHERLAND FPG-1000 FORGING PRESS</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">1,000 TON CAPACITY • I-PRESS® AB PLUS • X-GUIDANCE SLIDE</text>
</svg>