<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBgRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <radialGradient id="moltenGlowRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c82425" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#062040" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridRing" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#navyBgRing)" />
  <rect width="600" height="400" fill="url(#gridRing)" opacity="0.7" />
  <circle cx="300" cy="180" r="160" fill="url(#moltenGlowRing)" />
  
  <!-- Seamless Rolled Ring Blueprint -->
  <g transform="translate(160, 60)" stroke-width="2.5" fill="none">
    <ellipse cx="140" cy="120" rx="130" ry="85" stroke="#f26a1b" stroke-width="3" />
    <ellipse cx="140" cy="120" rx="90" ry="58" stroke="#ffffff" stroke-width="2.5" />
    <ellipse cx="140" cy="155" rx="130" ry="85" stroke="#c82425" stroke-width="2" stroke-dasharray="6,4" />
    <ellipse cx="140" cy="155" rx="90" ry="58" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Vertical Wall Dimension lines -->
    <line x1="10" y1="120" x2="10" y2="155" stroke="#f26a1b" stroke-width="2.5" />
    <line x1="270" y1="120" x2="270" y2="155" stroke="#f26a1b" stroke-width="2.5" />
    <line x1="50" y1="120" x2="50" y2="155" stroke="#ffffff" stroke-width="2" />
    <line x1="230" y1="120" x2="230" y2="155" stroke="#ffffff" stroke-width="2" />
    
    <!-- Diameter Gauge Indicator -->
    <line x1="10" y1="120" x2="270" y2="120" stroke="#f26a1b" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="140" cy="120" r="4" fill="#ffffff" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SEAMLESS ROLLED RING (UP TO 200&quot; OD)</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">ASTM A668 CLASS D • AISI 4140/4340 Q&amp;T • YAW &amp; PITCH BEARING</text>
</svg>