<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19191d" />
      <stop offset="100%" stop-color="#0e0e11" />
    </linearGradient>
    <radialGradient id="furnaceFlame" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="20%" stop-color="#f26a1b" />
      <stop offset="60%" stop-color="#c82425" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)" />
  <circle cx="300" cy="180" r="140" fill="url(#furnaceFlame)" opacity="0.4" />
  
  <!-- Induction Furnace Silhouette -->
  <g transform="translate(180, 70)" stroke="#f7f7f5" stroke-width="2" fill="none">
    <rect x="50" y="40" width="140" height="180" rx="10" stroke="#f26a1b" stroke-width="3" fill="#141416" />
    <path d="M 30 70 L 50 70 L 50 190 L 30 190 Z" fill="#2c2c34" stroke="#444" />
    <path d="M 190 70 L 210 70 L 210 190 L 190 190 Z" fill="#2c2c34" stroke="#444" />
    <!-- Tilt pivot & hydraulic cylinder -->
    <circle cx="210" cy="130" r="14" fill="#c82425" stroke="#fff" />
    <line x1="210" y1="130" x2="240" y2="210" stroke="#f26a1b" stroke-width="6" />
    <!-- Spout with molten pour glow -->
    <path d="M 50 50 L 15 35 L 50 30 Z" fill="#f26a1b" stroke="#f26a1b" />
    <!-- Induction coil rings -->
    <line x1="55" y1="90" x2="185" y2="90" stroke="#c82425" stroke-width="3" stroke-dasharray="8,4" />
    <line x1="55" y1="110" x2="185" y2="110" stroke="#c82425" stroke-width="3" stroke-dasharray="8,4" />
    <line x1="55" y1="130" x2="185" y2="130" stroke="#c82425" stroke-width="3" stroke-dasharray="8,4" />
    <line x1="55" y1="150" x2="185" y2="150" stroke="#c82425" stroke-width="3" stroke-dasharray="8,4" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">3.5T CORELESS INDUCTION FURNACE</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">VIP POWER-TRAK • 2500 KW • HYDRAULIC TILT</text>
</svg>

