<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <pattern id="gridPig" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bgPig)" />
  <rect width="600" height="400" fill="url(#gridPig)" opacity="0.7" />
  <g transform="translate(160, 100)" stroke="#21447b" stroke-width="2" fill="#13396b">
    <!-- Stack of pig iron ingots -->
    <polygon points="40,140 180,140 200,180 20,180" fill="#1e3a5f" stroke="#2c5597" />
    <polygon points="170,140 310,140 330,180 150,180" fill="#234570" stroke="#2c5597" />
    <polygon points="100,90 240,90 260,130 80,130" fill="#2c5597" stroke="#3b69b5" />
    <polygon points="160,40 300,40 320,80 140,80" fill="#3b69b5" stroke="#c82425" />
    <circle cx="230" cy="60" r="12" fill="#f26a1b" opacity="0.9" />
  </g>
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700">FOUNDRY-GRADE LOW-PHOS PIG IRON</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">FE 94.5% MIN • P &lt;0.04% • 120 MT PARCEL</text>
</svg>