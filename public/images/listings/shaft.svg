<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBgShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <radialGradient id="moltenGlowShaft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c82425" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#062040" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridShaft" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#navyBgShaft)" />
  <rect width="600" height="400" fill="url(#gridShaft)" opacity="0.7" />
  <circle cx="300" cy="190" r="160" fill="url(#moltenGlowShaft)" />
  
  <!-- Heavy Open-Die Forged Stepped Shaft Diagram -->
  <g transform="translate(80, 110)" stroke="#c82425" stroke-width="2.5" fill="none">
    <!-- Center Line -->
    <line x1="0" y1="80" x2="440" y2="80" stroke="#f26a1b" stroke-width="1.5" stroke-dasharray="10,4,2,4" />
    
    <!-- Step 1: Journal End -->
    <rect x="20" y="50" width="80" height="60" stroke="#ffffff" stroke-width="2" />
    <path d="M 20 50 A 10 30 0 0 0 20 110" stroke="#f26a1b" stroke-width="1.5" />
    
    <!-- Step 2: Intermediate Shoulder -->
    <rect x="100" y="35" width="90" height="90" stroke="#c82425" stroke-width="2.5" />
    
    <!-- Step 3: Main Pinion Barrel -->
    <rect x="190" y="15" width="130" height="130" stroke="#ffffff" stroke-width="2.5" />
    <!-- Gear teeth indication -->
    <line x1="210" y1="15" x2="210" y2="145" stroke="#f26a1b" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="255" y1="15" x2="255" y2="145" stroke="#f26a1b" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="300" y1="15" x2="300" y2="145" stroke="#f26a1b" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Step 4: Drive End -->
    <rect x="320" y="45" width="100" height="70" stroke="#ffffff" stroke-width="2" />
    
    <!-- Grain Flow Arrows -->
    <path d="M 40 70 Q 150 40 250 25 T 390 60" stroke="#f26a1b" stroke-width="1.2" stroke-dasharray="3,3" />
    <path d="M 40 90 Q 150 120 250 135 T 390 100" stroke="#f26a1b" stroke-width="1.2" stroke-dasharray="3,3" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">OPEN-DIE FORGED STEP SHAFT (AISI 4140)</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">ASTM A668 CLASS D • Q&amp;T • 1,850 KG • UT LEVEL 1</text>
</svg>
