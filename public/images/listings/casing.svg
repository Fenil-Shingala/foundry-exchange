<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0b" />
    </linearGradient>
    <radialGradient id="moltenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f26a1b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#25252a" stroke-width="0.7" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  <rect width="600" height="400" fill="url(#grid)" />
  <circle cx="300" cy="200" r="160" fill="url(#moltenGlow)" />
  
  <!-- Industrial Blueprint/Casing Illustration -->
  <g transform="translate(180, 80)" stroke="#c82425" stroke-width="2.5" fill="none">
    <circle cx="120" cy="120" r="90" stroke="#f26a1b" stroke-dasharray="6,4" />
    <circle cx="120" cy="120" r="70" />
    <circle cx="120" cy="120" r="35" stroke="#ffffff" />
    <circle cx="120" cy="120" r="8" fill="#c82425" />
    
    <!-- Bolt Holes -->
    <circle cx="120" cy="45" r="5" fill="#f7f7f5" />
    <circle cx="120" cy="195" r="5" fill="#f7f7f5" />
    <circle cx="45" cy="120" r="5" fill="#f7f7f5" />
    <circle cx="195" cy="120" r="5" fill="#f7f7f5" />
    <circle cx="67" cy="67" r="5" fill="#f7f7f5" />
    <circle cx="173" cy="173" r="5" fill="#f7f7f5" />
    <circle cx="67" cy="173" r="5" fill="#f7f7f5" />
    <circle cx="173" cy="67" r="5" fill="#f7f7f5" />
    
    <!-- Flange outlet -->
    <path d="M 120 30 L 210 0 L 230 40 L 175 65" stroke="#c82425" stroke-width="3" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ASTM A536 DUCTILE VOLUTE</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">EN-GJS-400-15 • 480 KG • HYDRO 25 BAR</text>
</svg>

