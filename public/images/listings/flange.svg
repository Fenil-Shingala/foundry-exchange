<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBgFlange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <radialGradient id="moltenGlowFlange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c82425" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#062040" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridFlange" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#navyBgFlange)" />
  <rect width="600" height="400" fill="url(#gridFlange)" opacity="0.7" />
  <circle cx="300" cy="190" r="160" fill="url(#moltenGlowFlange)" />
  
  <!-- High Pressure Forged Flange Illustration -->
  <g transform="translate(190, 70)" stroke="#c82425" stroke-width="2.5" fill="none">
    <ellipse cx="110" cy="120" rx="100" ry="85" stroke="#f26a1b" stroke-width="2" />
    <ellipse cx="110" cy="120" rx="75" ry="60" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="110" cy="120" rx="42" ry="32" stroke="#c82425" stroke-width="2.5" />
    <ellipse cx="110" cy="120" rx="20" ry="14" fill="#062040" stroke="#f26a1b" />
    
    <!-- Bolt Holes Along Pitch Circle -->
    <circle cx="110" cy="45" r="5" fill="#ffffff" />
    <circle cx="110" cy="195" r="5" fill="#ffffff" />
    <circle cx="20" cy="120" r="5" fill="#ffffff" />
    <circle cx="200" cy="120" r="5" fill="#ffffff" />
    <circle cx="45" cy="65" r="5" fill="#ffffff" />
    <circle cx="175" cy="175" r="5" fill="#ffffff" />
    <circle cx="45" cy="175" r="5" fill="#ffffff" />
    <circle cx="175" cy="65" r="5" fill="#ffffff" />

    <!-- Forged Neck Section -->
    <path d="M 80 148 L 70 210 L 150 210 L 140 148" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,3" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ASTM A105 / A182 FORGED FLANGE</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">CLASS 600# • WELD NECK • 100% UT TESTED</text>
</svg>
