<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBgLiner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <radialGradient id="moltenGlowLiner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c82425" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#062040" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridLiner" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#navyBgLiner)" />
  <rect width="600" height="400" fill="url(#gridLiner)" opacity="0.7" />
  <circle cx="300" cy="180" r="160" fill="url(#moltenGlowLiner)" />
  
  <!-- Crusher Mantle & Corrugated Jaw Liner Geometry -->
  <g transform="translate(180, 50)" stroke-width="2.5" fill="none">
    <!-- Heavy Corrugated Jaw Plate Profile -->
    <path d="M 20 20 L 220 20 L 220 50 L 20 50 Z" stroke="#ffffff" stroke-width="2.5" fill="#0d2b52" />
    <!-- Corrugation Teeth -->
    <path d="M 35 50 L 50 100 L 65 50 L 80 100 L 95 50 L 110 100 L 125 50 L 140 100 L 155 50 L 170 100 L 185 50 L 205 50" stroke="#f26a1b" stroke-width="3" fill="#13396b" />
    <path d="M 35 220 L 50 170 L 65 220 L 80 170 L 95 220 L 110 170 L 125 220 L 140 170 L 155 220 L 170 170 L 185 220 L 205 220" stroke="#c82425" stroke-width="3" fill="#13396b" />
    <path d="M 20 220 L 220 220 L 220 250 L 20 250 Z" stroke="#ffffff" stroke-width="2.5" fill="#0d2b52" />

    <!-- Hardness & Stress Zone Lines -->
    <line x1="50" y1="100" x2="50" y2="170" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="110" y1="100" x2="110" y2="170" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="170" y1="100" x2="170" y2="170" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">HIGH-MANGANESE CRUSHER JAW LINER</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">HADFIELD STEEL Mn18Cr2 • ASTM A128 • WORK-HARDENING 550+ HBW</text>
</svg>