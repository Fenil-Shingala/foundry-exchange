<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBgKnuckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <radialGradient id="moltenGlowKnuckle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c82425" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#062040" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridKnuckle" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#navyBgKnuckle)" />
  <rect width="600" height="400" fill="url(#gridKnuckle)" opacity="0.7" />
  <circle cx="300" cy="180" r="160" fill="url(#moltenGlowKnuckle)" />
  
  <!-- Steering Knuckle Blueprint Geometry -->
  <g transform="translate(180, 50)" stroke-width="2.5" fill="none">
    <!-- Center Hub Bore -->
    <circle cx="120" cy="130" r="48" stroke="#ffffff" stroke-width="3" fill="#0d2b52" />
    <circle cx="120" cy="130" r="32" stroke="#f26a1b" stroke-width="2.5" fill="#062040" />
    <circle cx="120" cy="130" r="12" stroke="#c82425" stroke-width="2" />
    
    <!-- Top Strut Attachment Arm -->
    <path d="M 105 84 L 95 25 L 145 25 L 135 84" stroke="#ffffff" stroke-width="2.5" fill="#13396b" />
    <circle cx="120" cy="38" r="7" stroke="#f26a1b" stroke-width="2" fill="#062040" />
    
    <!-- Lower Ball Joint Boss -->
    <path d="M 108 178 L 98 235 L 142 235 L 132 178" stroke="#ffffff" stroke-width="2.5" fill="#13396b" />
    <circle cx="120" cy="220" r="7" stroke="#f26a1b" stroke-width="2" fill="#062040" />
    
    <!-- Steering Tie-Rod Arm -->
    <path d="M 165 140 L 235 155 L 235 185 L 155 160" stroke="#f26a1b" stroke-width="2.5" fill="#1e3a64" />
    <circle cx="225" cy="170" r="6" stroke="#ffffff" stroke-width="2" fill="#062040" />
    
    <!-- Brake Caliper Mount Ears -->
    <path d="M 75 110 L 25 95 L 25 120 L 73 130" stroke="#c82425" stroke-width="2" fill="#13396b" />
    <circle cx="35" cy="108" r="5" stroke="#ffffff" stroke-width="1.5" fill="#062040" />
    <path d="M 75 150 L 25 165 L 25 190 L 73 170" stroke="#c82425" stroke-width="2" fill="#13396b" />
    <circle cx="35" cy="178" r="5" stroke="#ffffff" stroke-width="1.5" fill="#062040" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">CLOSED-DIE FORGED STEERING KNUCKLE</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">SAE 4140H / 42CrMo4 • IATF 16949 • 100% MPI INSPECTED</text>
</svg>