<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgImpeller" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <pattern id="gridImpeller" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bgImpeller)" />
  <rect width="600" height="400" fill="url(#gridImpeller)" opacity="0.7" />
  <g transform="translate(300, 190)" stroke="#c82425" stroke-width="3" fill="none">
    <circle cx="0" cy="0" r="110" stroke="#f26a1b" stroke-width="2" />
    <circle cx="0" cy="0" r="40" fill="#0d2238" stroke="#fff" />
    <!-- Impeller curved vanes -->
    <path d="M 0 -40 Q 50 -70 90 -40" stroke="#f26a1b" stroke-width="6" stroke-linecap="round" />
    <path d="M 38 -12 Q 85 20 80 65" stroke="#f26a1b" stroke-width="6" stroke-linecap="round" />
    <path d="M 23 32 Q 35 85 -10 95" stroke="#f26a1b" stroke-width="6" stroke-linecap="round" />
    <path d="M -23 32 Q -80 60 -85 10" stroke="#f26a1b" stroke-width="6" stroke-linecap="round" />
    <path d="M -38 -12 Q -65 -60 -20 -90" stroke="#f26a1b" stroke-width="6" stroke-linecap="round" />
  </g>
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700">25% HIGH-CHROME MINING IMPELLER</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">ASTM A532 CLASS III • 65 HRC • SLURRY SERVICE</text>
</svg>