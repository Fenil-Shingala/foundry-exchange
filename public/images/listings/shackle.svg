<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBgShackle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3161" />
      <stop offset="100%" stop-color="#062040" />
    </linearGradient>
    <radialGradient id="moltenGlowShackle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c82425" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#062040" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridShackle" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#13396b" stroke-width="0.8" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#navyBgShackle)" />
  <rect width="600" height="400" fill="url(#gridShackle)" opacity="0.7" />
  <circle cx="300" cy="180" r="160" fill="url(#moltenGlowShackle)" />
  
  <!-- Forged Anchor Bow Shackle Geometry -->
  <g transform="translate(195, 50)" stroke-width="2.5" fill="none">
    <!-- Bow Loop -->
    <path d="M 50 190 C 20 120, 30 40, 105 30 C 180 40, 190 120, 160 190" stroke="#f26a1b" stroke-width="18" stroke-linecap="round" fill="none" />
    <path d="M 50 190 C 20 120, 30 40, 105 30 C 180 40, 190 120, 160 190" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" fill="none" />
    
    <!-- Left & Right Pin Eyelets -->
    <circle cx="45" cy="205" r="22" stroke="#ffffff" stroke-width="3" fill="#0d2b52" />
    <circle cx="165" cy="205" r="22" stroke="#ffffff" stroke-width="3" fill="#0d2b52" />
    
    <!-- Cross Pin -->
    <rect x="25" y="195" width="160" height="20" rx="3" stroke="#c82425" stroke-width="2.5" fill="#f26a1b" />
    <!-- Pin Head & Thread Eye -->
    <rect x="15" y="190" width="14" height="30" rx="2" stroke="#ffffff" stroke-width="2" fill="#062040" />
    <circle cx="195" cy="205" r="10" stroke="#ffffff" stroke-width="2" fill="#062040" />
  </g>
  
  <text x="30" y="360" fill="#f7f7f5" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FORGED ALLOY SAFETY BOW SHACKLES</text>
  <text x="30" y="380" fill="#f26a1b" font-family="monospace" font-size="12">GRADE 80 ALLOY STEEL • 5:1 SAFETY FACTOR • ASME B30.26 / EN 13889</text>
</svg>